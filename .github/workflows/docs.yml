name: docs

on:
  push:
    branches:
      - main
    paths:
      - "*.md"
      - "docs/**"
      - "docs-site/**"
      - "test/docs-content-migration.test.mjs"
      - "scripts/prepare_blume_content.mjs"
      - "scripts/build_docs_site.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned documentation dependencies
        run: npm ci --prefix docs-site

      - name: Build documentation
        run: npm run build --prefix docs-site

      - name: Verify public content, navigation, anchors, and examples
        run: node --test test/docs-content-migration.test.mjs

      - name: Validate documentation
        working-directory: docs-site
        run: |
          npm exec -- blume validate
          npm exec -- blume doctor
